name: Build Native Player Lab webOS 2
run-name: XIPTV Native Player Lab v0.3.2 Build #${{ github.run_number }}
on:
  push:
    branches:
      - feat/native-player-lab-webos2-20261122
    paths:
      - 'native-player-lab/**'
      - '.github/workflows/native-player-lab-webos2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-webos2:
    name: Build NDL and ACB native ARM engines
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout XIPTV experiment branch
        uses: actions/checkout@v4
      - name: Checkout pinned upstream native decoder samples
        uses: actions/checkout@v4
        with:
          repository: webosbrew/samples
          ref: a8833ae3170283379fab08b463d3a177722c46c8
          path: upstream-samples
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build ffmpeg pkg-config
          npm install -g @webos-tools/cli
          ares-package --version
      - name: Prepare ten-second offline H264 and AAC streams
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=640x360:rate=25 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 10 -c:v libx264 -preset ultrafast -profile:v baseline -level 3.0 -pix_fmt yuv420p -x264-params bframes=0:keyint=50 -c:a aac -b:a 96k -ar 48000 -ac 2 -shortest /tmp/native-lab.mp4
          SAMPLE_DURATION=10 upstream-samples/assets/make-sample.sh /tmp/native-lab.mp4 upstream-samples/assets
          test -s upstream-samples/assets/sample.h264
          test -s upstream-samples/assets/sample.aac
      - name: Fetch unofficial native ARM toolchain
        uses: robinraju/release-downloader@v1.12
        with:
          repository: openlgtv/buildroot-nc4
          tag: 2026.08-webos
          fileName: arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz
          out-file-path: /tmp
          extract: true
      - name: Relocate SDK and assign isolated lab app IDs
        run: |
          set -euo pipefail
          (cd /tmp && ./arm-webos-linux-gnueabi_sdk-buildroot/relocate-sdk.sh)
          python3 native-player-lab/patch_upstream.py upstream-samples
          python3 native-player-lab/build_inprocess.py upstream-samples
      - name: Check isolated HLS bridge implementation
        run: |
          node --check native-player-lab/relay.mjs
          node -e 'const fs=require("fs");const x=fs.readFileSync("native-player-lab/launcher/index.html","utf8");const js=x.split("<script>")[1].split("</script>")[0];new Function(js);if(!x.includes("M3U Linkini Yukle")||!x.includes("Film Ara")||!x.includes("localStorage.setItem"))process.exit(1);'
          node --check lg-media-service/server.mjs
          node -e "let fs=require('fs'),x=fs.readFileSync('native-player-lab/launcher/index.html','utf8');if(!x.includes('PalmServiceBridge')||!x.includes('/prepare'))process.exit(1)"
      - name: Compile both ARM hardware decoder executables
        run: |
          set -euo pipefail
          cmake -S upstream-samples -B upstream-samples/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=/tmp/arm-webos-linux-gnueabi_sdk-buildroot/share/buildroot/toolchainfile.cmake
          cmake --build upstream-samples/build --target media-ndl-esplayer media-smp-acb-webos2 media-lab-auto --parallel 2
          file upstream-samples/build/media/ndl/esplayer/media-ndl-esplayer | grep -q ARM
          file upstream-samples/build/media/smp/acb/media-smp-acb-webos2 | grep -q ARM
      - name: Verify single-process native auto player
        run: |
          set -euo pipefail
          file upstream-samples/build/media/smp/acb/media-lab-auto | grep -q ARM
          grep -q 'xiptv_ndl_main' upstream-samples/media/smp/acb/auto_entry.c
          grep -q 'xiptv_acb_main' upstream-samples/media/smp/acb/auto_entry.c
          if grep -E 'fork\(|execv\(' upstream-samples/media/smp/acb/auto_entry.c; then exit 1; fi
      - name: Stage native apps with generated appinfo
        run: |
          set -euo pipefail
          mkdir -p native-stage/ndl native-stage/acb native-stage/auto native-stage/launcher webos-lab-artifacts
          cp upstream-samples/build/media/ndl/esplayer/media-ndl-esplayer native-stage/ndl/
          cp upstream-samples/build/media/smp/acb/media-smp-acb-webos2 native-stage/acb/
          cp upstream-samples/build/media/smp/acb/media-lab-auto native-stage/auto/
          cp upstream-samples/build/media/ndl/esplayer/media-ndl-esplayer-appinfo.json native-stage/ndl/appinfo.json
          cp upstream-samples/build/media/smp/acb/media-smp-acb-webos2-appinfo.json native-stage/acb/appinfo.json
          cp upstream-samples/assets/icons/ndl-esplayer.png native-stage/ndl/icon.png
          cp upstream-samples/assets/icons/smp-acb-webos2.png native-stage/acb/icon.png
          cp upstream-samples/assets/icons/ndl-esplayer.png native-stage/auto/icon.png
          node -e "require('fs').writeFileSync('native-stage/auto/appinfo.json',JSON.stringify({id:'com.xiptvplay.playerlab.auto',version:'0.3.0',vendor:'XIPTV Play',type:'native',main:'media-lab-auto',title:'XIPTV Player Lab Auto NDL ACB',icon:'icon.png',iconColor:'#4CAF50',bgColor:'#4CAF50'}))"
          cp upstream-samples/assets/sample.h264 upstream-samples/assets/sample.aac native-stage/ndl/
          cp upstream-samples/assets/sample.h264 upstream-samples/assets/sample.aac native-stage/acb/
          cp upstream-samples/assets/sample.h264 upstream-samples/assets/sample.aac native-stage/auto/
          cp native-player-lab/launcher/index.html native-stage/launcher/index.html
          cp upstream-samples/assets/icons/ndl-esplayer.png native-stage/launcher/icon.png
          node -e "require('fs').writeFileSync('native-stage/launcher/appinfo.json',JSON.stringify({id:'com.xiptvplay.playerlab.launcher',version:'0.3.2',vendor:'XIPTV Play',type:'web',main:'index.html',title:'XIPTV Native HLS Lab',icon:'icon.png',disableBackHistoryAPI:true}))"
          node -e "let a=require('./native-stage/ndl/appinfo.json'),b=require('./native-stage/acb/appinfo.json');if(a.id!=='com.xiptvplay.playerlab.ndl'||b.id!=='com.xiptvplay.playerlab.acb.webos2'||a.type!=='native'||b.type!=='native')process.exit(1)"
      - name: Package dedicated native IPKs with current CLI
        run: |
          set -euo pipefail
          ares-package native-stage/ndl -o webos-lab-artifacts
          ares-package native-stage/acb -o webos-lab-artifacts
          ares-package native-stage/auto -o webos-lab-artifacts
          ares-package native-stage/launcher -o webos-lab-artifacts
          find webos-lab-artifacts -maxdepth 1 -type f -name '*.ipk' -printf '%f: %s bytes\\n'
          test "$(find webos-lab-artifacts -maxdepth 1 -type f -name '*.ipk' | wc -l)" -eq 4
      - name: Upload four isolated Native Player Lab IPKs
        uses: actions/upload-artifact@v4
        with:
          name: xiptvplay-native-player-lab-webos2
          path: webos-lab-artifacts/*.ipk
          if-no-files-found: error
          retention-days: 14
