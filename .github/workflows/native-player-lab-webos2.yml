name: Build Native Player Lab webOS 2
run-name: XIPTV NDL-backed Single App v0.5.1 Build #${{ github.run_number }}
on:
  push:
    branches:
      - feat/native-player-lab-webos2-20261122
    paths:
      - 'native-player-lab/**'
      - '.github/workflows/native-player-lab-webos2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-webos2:
    name: Build NDL and ACB native ARM engines
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout XIPTV experiment branch
        uses: actions/checkout@v4
      - name: Checkout pinned upstream native decoder samples
        uses: actions/checkout@v4
        with:
          repository: webosbrew/samples
          ref: a8833ae3170283379fab08b463d3a177722c46c8
          path: upstream-samples
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build ffmpeg pkg-config
          npm install -g @webos-tools/cli
          ares-package --version
      - name: Prepare ten-second offline H264 and AAC streams
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=640x360:rate=25 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 10 -c:v libx264 -preset ultrafast -profile:v baseline -level 3.0 -pix_fmt yuv420p -x264-params bframes=0:keyint=50 -c:a aac -b:a 96k -ar 48000 -ac 2 -shortest /tmp/native-lab.mp4
          SAMPLE_DURATION=10 upstream-samples/assets/make-sample.sh /tmp/native-lab.mp4 upstream-samples/assets
          test -s upstream-samples/assets/sample.h264
          test -s upstream-samples/assets/sample.aac
      - name: Render static 10-second native hardware-plane menu background
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=0x102838:s=640x360:r=25 -f lavfi -i anullsrc=r=48000:cl=stereo -t 10 -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='XIPTV PLAY - NATIVE MENU':fontcolor=white:fontsize=27:x=42:y=38,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='FILM ARA - FILM SEC - OYNAT':fontcolor=cyan:fontsize=22:x=42:y=135,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='KUMANDA OK - SECIM     GERI - CIKIS':fontcolor=white:fontsize=15:x=42:y=290" -c:v libx264 -preset ultrafast -profile:v baseline -level 3.0 -pix_fmt yuv420p -x264-params bframes=0:keyint=50 -c:a aac -b:a 48k -ar 48000 -ac 2 -shortest /tmp/xiptv-menu.mp4
          ffmpeg -hide_banner -loglevel error -y -i /tmp/xiptv-menu.mp4 -map 0:v:0 -c:v copy -bsf:v h264_mp4toannexb -f h264 /tmp/xiptv-menu.h264
          ffmpeg -hide_banner -loglevel error -y -i /tmp/xiptv-menu.mp4 -map 0:a:0 -c:a copy -f adts /tmp/xiptv-menu.aac
          test -s /tmp/xiptv-menu.h264
          test -s /tmp/xiptv-menu.aac
      - name: Fetch unofficial native ARM toolchain
        uses: robinraju/release-downloader@v1.12
        with:
          repository: openlgtv/buildroot-nc4
          tag: 2026.08-webos
          fileName: arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz
          out-file-path: /tmp
          extract: true
      - name: Relocate SDK and assign isolated lab app IDs
        run: |
          set -euo pipefail
          (cd /tmp && ./arm-webos-linux-gnueabi_sdk-buildroot/relocate-sdk.sh)
          python3 native-player-lab/patch_upstream.py upstream-samples
          python3 native-player-lab/build_inprocess.py upstream-samples
          python3 native-player-lab/build_overlay_smoke.py upstream-samples
      - name: Check isolated HLS bridge implementation
        run: |
          node --check native-player-lab/relay.mjs
          python3 -c "from pathlib import Path; s=Path('native-player-lab/unified_native.c').read_text(); assert 'ndl_menu_start(&shell)' in s; assert 'ndl_menu_tick();' in s; assert 'ndl_menu_stop(&shell);' in s; assert 'SDL_SetWindowOpacity' not in s"
          grep -q 'esplayer_load' native-player-lab/menu_background.c
          grep -q 'esplayer_feed' native-player-lab/menu_background.c
          grep -q 'if(origin==0)' native-player-lab/menu_background.c
          grep -q 'SDL_SetRenderDrawColor(shell.renderer,0,0,0,0)' native-player-lab/unified_native.c
          test -s native-player-lab/build_overlay_smoke.py
          test -s native-player-lab/display_smoke.c
          grep -q 'sdl_shell_open_window' native-player-lab/display_smoke.c
          if grep -E 'curl_|xiptv_ndl|xiptv_acb' native-player-lab/display_smoke.c; then exit 1; fi
          node -e "const s=require('fs').readFileSync('native-player-lab/unified_native.c','utf8');if(!s.includes('pairing_start')||!s.includes('search_movies')||!s.includes('play_movie'))process.exit(1)"
          python3 -c "from pathlib import Path; s=Path('native-player-lab/unified_native.c').read_text(); main=s.split('int main(int argc,char **argv){')[1]; assert main.index('ndl_menu_start(&shell)')<main.index('curl_global_init'); assert main.index('present();')<main.index('curl_global_init'); assert 'if(mode==0)pairing_start();' not in main"
          node -e "const fs=require('fs'),s=fs.readFileSync('native-player-lab/relay.mjs','utf8');if(!s.includes('pathname===\x27/diag\x27')||!s.includes('pending clip collected'))process.exit(1)"
          node -e "const fs=require('fs');const relay=fs.readFileSync('native-player-lab/relay.mjs','utf8'),c=fs.readFileSync('native-player-lab/source_fetch.c','utf8');if(!relay.includes('pathname===\x27/pending\x27')||!relay.includes('pending.set(clientIp(req)')||!c.includes('take_pending(token)'))process.exit(1)"
          node -e 'const fs=require("fs");const x=fs.readFileSync("native-player-lab/launcher/index.html","utf8");const js=x.split("<script>")[1].split("</script>")[0];new Function(js);if(!x.includes("M3U Linkini Yukle")||!x.includes("Film Ara")||!x.includes("localStorage.setItem")||!x.includes("id=\"search\"")||!x.includes("account-panel"))process.exit(1);'
          node --check lg-media-service/server.mjs
          node -e "let fs=require('fs'),x=fs.readFileSync('native-player-lab/launcher/index.html','utf8');if(!x.includes('PalmServiceBridge')||!x.includes('/prepare'))process.exit(1)"
      - name: Compile both ARM hardware decoder executables
        run: |
          set -euo pipefail
          cmake -S upstream-samples -B upstream-samples/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=/tmp/arm-webos-linux-gnueabi_sdk-buildroot/share/buildroot/toolchainfile.cmake
          cmake --build upstream-samples/build --target media-ndl-esplayer media-smp-acb-webos2 media-lab-auto media-lab-unified media-lab-display-smoke media-lab-overlay-smoke --parallel 2
          file upstream-samples/build/media/ndl/esplayer/media-ndl-esplayer | grep -q ARM
          file upstream-samples/build/media/ndl/esplayer/media-lab-overlay-smoke | grep -q ARM
          file upstream-samples/build/media/smp/acb/media-smp-acb-webos2 | grep -q ARM
      - name: Verify single-process native auto player
        run: |
          set -euo pipefail
          file upstream-samples/build/media/smp/acb/media-lab-auto | grep -q ARM
          file upstream-samples/build/media/smp/acb/media-lab-unified | grep -q ARM
          file upstream-samples/build/media/smp/acb/media-lab-display-smoke | grep -q ARM
          grep -q 'xiptv_ndl_main' upstream-samples/media/smp/acb/auto_entry.c
          grep -q 'xiptv_acb_main' upstream-samples/media/smp/acb/auto_entry.c
          if grep -E 'fork\(|execv\(' upstream-samples/media/smp/acb/auto_entry.c; then exit 1; fi
      - name: Stage native apps with generated appinfo
        run: |
          set -euo pipefail
          mkdir -p native-stage/ndl native-stage/acb native-stage/auto native-stage/launcher native-stage/unified native-stage/display-smoke native-stage/overlay-smoke webos-lab-artifacts
          cp upstream-samples/build/media/ndl/esplayer/media-ndl-esplayer native-stage/ndl/
          cp upstream-samples/build/media/ndl/esplayer/media-lab-overlay-smoke native-stage/overlay-smoke/
          cp upstream-samples/build/media/smp/acb/media-smp-acb-webos2 native-stage/acb/
          cp upstream-samples/build/media/smp/acb/media-lab-auto native-stage/auto/
          cp upstream-samples/build/media/smp/acb/media-lab-unified native-stage/unified/
          cp upstream-samples/build/media/smp/acb/media-lab-display-smoke native-stage/display-smoke/
          cp upstream-samples/build/media/ndl/esplayer/media-ndl-esplayer-appinfo.json native-stage/ndl/appinfo.json
          cp upstream-samples/build/media/smp/acb/media-smp-acb-webos2-appinfo.json native-stage/acb/appinfo.json
          cp upstream-samples/assets/icons/ndl-esplayer.png native-stage/ndl/icon.png
          cp upstream-samples/assets/icons/ndl-esplayer.png native-stage/overlay-smoke/icon.png
          cp upstream-samples/assets/icons/smp-acb-webos2.png native-stage/acb/icon.png
          cp upstream-samples/assets/icons/ndl-esplayer.png native-stage/auto/icon.png
          cp upstream-samples/assets/icons/ndl-esplayer.png native-stage/unified/icon.png
          cp upstream-samples/assets/icons/ndl-esplayer.png native-stage/display-smoke/icon.png
          node -e "require('fs').writeFileSync('native-stage/auto/appinfo.json',JSON.stringify({id:'com.xiptvplay.playerlab.auto',version:'0.3.6',vendor:'XIPTV Play',type:'native',main:'media-lab-auto',title:'XIPTV Player Lab Auto NDL ACB',icon:'icon.png',iconColor:'#4CAF50',bgColor:'#4CAF50'}))"
          cp upstream-samples/assets/sample.h264 upstream-samples/assets/sample.aac native-stage/ndl/
          cp upstream-samples/assets/sample.h264 upstream-samples/assets/sample.aac native-stage/overlay-smoke/
          cp upstream-samples/assets/sample.h264 upstream-samples/assets/sample.aac native-stage/acb/
          cp upstream-samples/assets/sample.h264 upstream-samples/assets/sample.aac native-stage/auto/
          cp upstream-samples/assets/sample.h264 upstream-samples/assets/sample.aac native-stage/unified/
          cp /tmp/xiptv-menu.h264 native-stage/unified/menu.h264
          cp /tmp/xiptv-menu.aac native-stage/unified/menu.aac
          node -e "require('fs').writeFileSync('native-stage/overlay-smoke/appinfo.json',JSON.stringify({id:'com.xiptvplay.playerlab.overlay-smoke',version:'0.1.0',vendor:'XIPTV Play',type:'native',main:'media-lab-overlay-smoke',title:'XIPTV NDL Video Uzeri Menu Test',icon:'icon.png',iconColor:'#123456'}))"
          node -e "require('fs').writeFileSync('native-stage/display-smoke/appinfo.json',JSON.stringify({id:'com.xiptvplay.playerlab.display-smoke',version:'0.1.0',vendor:'XIPTV Play',type:'native',main:'media-lab-display-smoke',title:'XIPTV SDL Ekran Testi',icon:'icon.png',iconColor:'#123456'}))"
          node -e "require('fs').writeFileSync('native-stage/unified/appinfo.json',JSON.stringify({id:'com.xiptvplay.playerlab.unified',version:'0.5.1',vendor:'XIPTV Play',type:'native',main:'media-lab-unified',title:'XIPTV Native HLS Lab Tek Uygulama',icon:'icon.png',iconColor:'#116B86',bgColor:'#0C1C2D'}))"
          cp native-player-lab/launcher/index.html native-stage/launcher/index.html
          cp upstream-samples/assets/icons/ndl-esplayer.png native-stage/launcher/icon.png
          node -e "require('fs').writeFileSync('native-stage/launcher/appinfo.json',JSON.stringify({id:'com.xiptvplay.playerlab.launcher',version:'0.3.6',vendor:'XIPTV Play',type:'web',main:'index.html',title:'XIPTV Native HLS Lab',icon:'icon.png',disableBackHistoryAPI:true}))"
          node -e "let a=require('./native-stage/ndl/appinfo.json'),b=require('./native-stage/acb/appinfo.json');if(a.id!=='com.xiptvplay.playerlab.ndl'||b.id!=='com.xiptvplay.playerlab.acb.webos2'||a.type!=='native'||b.type!=='native')process.exit(1)"
      - name: Package dedicated native IPKs with current CLI
        run: |
          set -euo pipefail
          ares-package native-stage/ndl -o webos-lab-artifacts
          ares-package native-stage/acb -o webos-lab-artifacts
          ares-package native-stage/auto -o webos-lab-artifacts
          ares-package native-stage/launcher -o webos-lab-artifacts
          ares-package native-stage/unified -o webos-lab-artifacts
          ares-package native-stage/display-smoke -o webos-lab-artifacts
          ares-package native-stage/overlay-smoke -o webos-lab-artifacts
          find webos-lab-artifacts -maxdepth 1 -type f -name '*.ipk' -printf '%f: %s bytes\\n'
          test "$(find webos-lab-artifacts -maxdepth 1 -type f -name '*.ipk' | wc -l)" -eq 7
      - name: Upload Native Player Lab and standalone SDL diagnosis IPKs
        uses: actions/upload-artifact@v4
        with:
          name: xiptvplay-native-player-lab-webos2
          path: webos-lab-artifacts/*.ipk
          if-no-files-found: error
          retention-days: 14
