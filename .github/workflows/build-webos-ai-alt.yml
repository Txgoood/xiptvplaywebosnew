name: Build LG webOS IPK (AI Test)
run-name: XIPTV Play TV AI Test v1.0.90 Build #${{ github.run_number }} • ${{ github.ref_name }}

# Independent build for the alternative VOD engine.
# - Runs ONLY for branches named ai-alt/** (never for main, never for the other developer's branches).
# - Produces ONLY the AI Test package: app id com.xiptvplay.tv.experiment, title "XIPTV Play TV AI Test".
# - Does not touch the main XIPTV Play / XIPTV Play Native packages, Render services or the Android project.
# Note: the run number below is this workflow's own counter; it is unrelated to the main workflow's build numbers.

on:
  push:
    branches:
      - 'ai-alt/**'
    paths:
      - 'webos/**'
      - '.github/workflows/build-webos-ai-alt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Package and verify AI Test IPK
    if: startsWith(github.ref, 'refs/heads/ai-alt/')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static checks and existing tests (regression guard)
        run: |
          set -euo pipefail
          for f in webos/build.mjs lg-media-service/server.mjs webos/tv-mkv-tracks.js webos/tv-lg-media.js webos/tv-player-ui.js webos/tv-alt-player.js webos/tv-posters.js webos/tv-poster-cache.js webos/tv-performance.js webos/tv-home.js webos/tv-themes.js webos/tv-metadata.js webos/tv-features.js webos/tv-playlist-input.js webos/tv-vod-recovery.js webos/tv-iptv.js webos/tv-catalog-navigation.js webos/tv-keyboard.js webos/tv-global-search.js webos/tv-catalog-layout.js webos/tv-ai-engine.js; do
            node --check "$f"
          done
          node --test lg-media-service/test.mjs
          node webos/mkv-tracks.test.mjs
          node --test webos/playlist-input.test.mjs
          node --test webos/vod-recovery.test.mjs
          node --test webos/catalog-navigation.test.mjs
          node --test webos/global-search.test.mjs

      - name: Prepare AI Test app
        run: |
          set -euo pipefail
          mkdir -p dist
          cp webos/legacy-index.html dist/index.html
          WEBOS_LEGACY=true WEBOS_VARIANT=experiment node webos/build.mjs

      - name: Generate offline H.264 Baseline / AAC-LC sample and test tools
        run: |
          set -euo pipefail
          # Build-time tools only (prebuilt Linux binaries from npm); not included in the IPK.
          npm install --prefix /tmp/webos-media-tools --no-save --ignore-scripts --no-audit --no-fund --fetch-retries=2 --fetch-timeout=90000 @ffmpeg-installer/linux-x64@4.1.0 @ffprobe-installer/linux-x64@5.2.0
          FFMPEG=/tmp/webos-media-tools/node_modules/@ffmpeg-installer/linux-x64/ffmpeg
          FFPROBE=/tmp/webos-media-tools/node_modules/@ffprobe-installer/linux-x64/ffprobe
          chmod +x "$FFMPEG" "$FFPROBE"
          "$FFMPEG" -version | head -n 1
          "$FFMPEG" -nostdin -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=640x360:rate=25 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 5 -c:v libx264 -profile:v baseline -level:v 3.0 -pix_fmt yuv420p -b:v 900k -maxrate 900k -bufsize 1800k -c:a aac -profile:a aac_low -b:a 96k -ar 48000 -ac 2 -movflags +faststart -shortest webos-package/sample.mp4
          "$FFPROBE" -v error -show_entries stream=codec_name,profile,width,height -of default=noprint_wrappers=1 webos-package/sample.mp4 | tee /tmp/webos-video-codecs.txt
          grep -q 'codec_name=h264' /tmp/webos-video-codecs.txt
          grep -q 'codec_name=aac' /tmp/webos-video-codecs.txt
          test -s webos-package/sample.mp4
          echo "FFMPEG_BIN=$FFMPEG" >> "$GITHUB_ENV"

      - name: AI engine tests (parsers verified against real ffmpeg output, end-to-end flow)
        run: node --test webos/ai-engine.test.mjs

      - name: Check AI Test package content
        run: |
          set -euo pipefail
          for f in index.html appinfo.json icon.png tv-remote.js tv-playlist-input.js tv-vod-recovery.js tv-iptv.js tv-lg-media.js tv-player-ui.js tv-mkv-tracks.js tv-ai-engine.js sample.mp4; do
            test -s "webos-package/$f"
          done
          grep -q 'id="iptv-open"' webos-package/index.html
          grep -q 'tv-ai-engine.js' webos-package/index.html
          grep -q 'v1.0.90 AI Test' webos-package/index.html
          if grep -q 'type="module"' webos-package/index.html; then
            echo "Unsupported modern JavaScript module found in webOS 2 package"
            exit 1
          fi
          # The engine must load AFTER tv-iptv.js and tv-lg-media.js, and live TV code must be untouched.
          node -e "const h=require('fs').readFileSync('webos-package/index.html','utf8'); const e=h.indexOf('tv-ai-engine.js'); if(e<0||e<h.indexOf('tv-lg-media.js')||e<h.indexOf('tv-iptv.js')) process.exit(1)"
          node -e "const f=require('./webos-package/appinfo.json'); if(f.type!=='web'||f.main!=='index.html'||f.id!=='com.xiptvplay.tv.experiment'||f.version!=='1.0.90'||f.title!=='XIPTV Play TV AI Test'||f.trustLevel!=='netcast'||f.vendorExtension?.allowCrossDomain!==true||f.disableBackHistoryAPI!==true) process.exit(1)"
          # ES5 guard for the engine that ships in the IPK.
          if grep -nE '=>|\blet |\bconst |`' webos-package/tv-ai-engine.js; then
            echo "Modern JavaScript syntax found in tv-ai-engine.js"
            exit 1
          fi

      - name: Run remote-control and playback UI smoke tests
        run: node webos/legacy-smoke-test.mjs

      - name: Install webOS CLI
        run: |
          npm install --global @webos-tools/cli
          ares-package --version

      - name: Build IPK
        run: |
          set -euo pipefail
          mkdir -p webos-artifacts
          ares-package --no-minify ./webos-package -o ./webos-artifacts
          find webos-artifacts -maxdepth 1 -name '*.ipk' -type f -size +0c -print | tee /tmp/webos-ipk-list.txt
          test -s /tmp/webos-ipk-list.txt
          grep -q 'com.xiptvplay.tv.experiment_1.0.90' /tmp/webos-ipk-list.txt
          {
            echo "### XIPTV Play TV AI Test"
            echo "- Version: v1.0.90"
            echo "- Build: #${{ github.run_number }} (this workflow's own counter)"
            echo "- Branch: ${{ github.ref_name }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Files:"
            (cd webos-artifacts && sha256sum *.ipk | sed 's/^/  - /')
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AI Test IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiptvplay-lg-webos-ai-test-ipk
          path: webos-artifacts/*.ipk
          if-no-files-found: error
          retention-days: 14
